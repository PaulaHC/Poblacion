services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    restart: unless-stopped

  telegraf:
    build:
      context: .
      dockerfile:  images/Dockerfile.telegraf
    image: mi-telegraf:1.32
    container_name: telegraf
#   user: "10202:10200"
    depends_on:
      - influxdb
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
    volumes:
      - ./config/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ${ETL_DIR}:/etl
      - ${CSV_DIR}:/data/csv:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_ENABLE_ALPHA: "true"
      GF_FEATURE_TOGGLES_ENABLE: "dynamicGeoJsonLayer"
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
    depends_on:
      - influxdb
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped
  
  backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      container_name: backend
      ports:
        - "8000:8000"
      environment:
        INFLUXDB_URL: http://influxdb:8086
        INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
        INFLUXDB_ORG: ${INFLUXDB_ORG}
        INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      depends_on:
        - influxdb
      restart: unless-stopped
  # --- NUEVO: frontend Next.js (dashboards + chat) ---
  app:
      build:
        context: ./app
        dockerfile: Dockerfile
      container_name: poblacion-app
      ports:
        - "8080:3000"
      environment:
        VITE_BACKEND: http://backend:8000
        VITE_API_URL: /api
      depends_on:
        - backend
      extra_hosts:
        - "host.docker.internal:host-gateway"
      restart: unless-stopped

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data: